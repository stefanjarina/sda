name: Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Task
        uses: go-task/setup-task@v2

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build
        run: task build

      - name: Vet
        run: task vet

      - name: Test
        run: task test
